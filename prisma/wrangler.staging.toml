# Dedicated Pages project. Never use this configuration with prismaspace.
name = "prisma-queen-staging"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "PRISMA_RATE_DB"
database_name = "prisma-queen-staging"
database_id = "980bad8f-0356-48b9-87bc-56bcf363f69a"
preview_database_id = "980bad8f-0356-48b9-87bc-56bcf363f69a"

# A deployment to this project's unused production branch stays disabled.
[vars]
QUEEN_ENABLED = "0"
QUEEN_BASE_URL = "https://queen.prismaspace.space/v1"
QUEEN_MODEL = "unsloth/Qwen3.5-2B-GGUF:Q4_K_M"
QUEEN_STAGE = "staging"
QUEEN_STAGING_DATABASE_ID = "980bad8f-0356-48b9-87bc-56bcf363f69a"

[env.preview.vars]
QUEEN_ENABLED = "1"
QUEEN_BASE_URL = "https://queen.prismaspace.space/v1"
QUEEN_MODEL = "unsloth/Qwen3.5-2B-GGUF:Q4_K_M"
QUEEN_STAGE = "staging"
QUEEN_STAGING_DATABASE_ID = "980bad8f-0356-48b9-87bc-56bcf363f69a"

[[env.preview.d1_databases]]
binding = "PRISMA_RATE_DB"
database_name = "prisma-queen-staging"
database_id = "980bad8f-0356-48b9-87bc-56bcf363f69a"
preview_database_id = "980bad8f-0356-48b9-87bc-56bcf363f69a"
