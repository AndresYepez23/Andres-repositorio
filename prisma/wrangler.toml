compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "PRISMA_RATE_DB"
database_name = "prisma-ai-limits"
database_id = "e02104b5-0861-475a-a60f-7658439d4fe0"

[[d1_databases]]
binding = "QUEEN_CONTROL_DB"
database_name = "prisma-queen-staging"
