name: Provider credential regression gate
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Both deployment URLs must belong to this same Pages environment'
        type: choice
        required: true
        options:
          - preview
          - production
      candidate_url:
        description: 'Immutable candidate Pages deployment URL'
        type: string
        required: true
      baseline_url:
        description: 'Immutable known-good Pages deployment URL from the same environment'
        type: string
        required: true
permissions:
  contents: read
jobs:
  compare-credential-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check provider bindings without reading secret values
        env:
          TARGET_ENV: ${{ inputs.environment }}
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          BASELINE_URL: ${{ inputs.baseline_url }}
        run: node prisma/scripts/check-provider-bindings.mjs "$TARGET_ENV" "$CANDIDATE_URL" "$BASELINE_URL"
