name: Prisma Core checks

on:
  pull_request:
    paths:
      - "prisma/**"
      - ".github/workflows/prisma-core-checks.yml"
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - ".github/workflows/prisma-core-checks.yml"

permissions:
  contents: read

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Prisma Core provider and workflow regressions
        run: node --test prisma/tests/core-agent-routing.test.mjs
