name: Prisma Core checks

on:
  pull_request:
    paths:
      - "prisma/**"
      - ".github/workflows/prisma-core-checks.yml"
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - ".github/workflows/prisma-core-checks.yml"

permissions:
  contents: read

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Prisma Core provider and workflow regressions
        run: node --test prisma/tests/queen-integration.test.mjs prisma/tests/queen-staging.test.mjs prisma/tests/queen.test.mjs prisma/tests/core-agent-routing.test.mjs prisma/tests/core-model-session.test.mjs prisma/tests/conversation-history.test.mjs prisma/tests/provider-orchestration.test.mjs prisma/tests/research-providers.test.mjs prisma/tests/core-create-model-groups.test.mjs prisma/tests/core-composer-single-row.test.mjs prisma/tests/core-creative-catalog.test.mjs prisma/tests/core-create-transcription.test.mjs prisma/tests/core-create-tts.test.mjs prisma/tests/core-create-picker-open.test.mjs prisma/tests/pollinations-audio-multikey.test.mjs
      - name: Build Prisma and test SEO output
        run: |
          node prisma/build.mjs
          node --test prisma/tests/seo-build.test.mjs
      - name: Check Queen VPS readers offline
        run: python3 -m unittest discover -s prisma/neural-pilot/staging/tests -p 'test_*.py' -v
